# Retargeting to the walking-controller (requires building with WalkingControllers).
# When enabled, joint references go to retargeting_port_name (connected automatically to
# retargeting_remote_port_name) instead of the motors. Enabling fails if the connection is not possible.
# Can be toggled at runtime via rpc: enable_retargeting / disable_retargeting / get_retargeting_status
retargeting_port_name /retargeting:o
retargeting_remote_port_name /walking-coordinator/humanState:i
retargeting_enabled false
