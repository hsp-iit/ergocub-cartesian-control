# CubJointControl
name left_arm
joint_axes_list (l_shoulder_pitch l_shoulder_roll l_shoulder_yaw l_elbow l_wrist_yaw l_wrist_roll l_wrist_pitch)
joint_ports_list (/ergocubSim/left_arm)
joint_local_port /mc-ergocub-cartesian-bimanual/left_arm


# IK_PARAM
joint_limits_param 0.90 #0 < joint_limits_param < 1
joint_pos_weight (0.01  0.01    0.01    0.01    0.01    0.01    0.01)
joint_pos_p_gain (3.0   3.0     3.0     3.0     3.0     3.0     3.0)
joint_pos_d_gain (3.5   3.5     3.5     3.5     3.5     3.5     3.5)
cartesian_pos_weight 20.0
cartesian_pos_p_gain 100.0
cartesian_pos_d_gain 20.0
cartesian_ori_weight 5.0
cartesian_ori_p_gain 100.0
cartesian_ori_d_gain 20.0
improve_manip_dyn 5.0
improve_manip_th 0.01

# Limits on top of the robot's (degrees, joint_axes_list order; none = robot limit): the elbow stays a bit bent,
# away from the stretched-arm singularity where shoulder and wrist yaw would spin.
joint_lower_limits (none  none    none    12.0    none    none    none)
# Joint speed limits [deg/s]: no jumps.
joint_max_vel      (120.0 120.0   120.0   120.0   150.0   120.0   120.0)


# FK_PARAM
root_frame_name root_link
ee_frame_name l_hand_palm


# FSM_PARAM
stop_vel 0.0175  #[rad] 0.0175 = 1.0 deg; 0.0314159 rad = 2.0 deg;  0.0087 rad = 0.5 deg


# ARM_DIR_PARAM (upper-arm direction from /mc-ergocub-cartesian-bimanual/arm_dir:i; weight 0 or missing = disabled)
# Weights: hand pose >> arm direction > posture.
arm_dir_weight 1.0
arm_dir_p_gain 50.0
arm_dir_d_gain 14.0
# upper_arm_frame_name defaults to r_upper_arm / l_upper_arm; the shoulder->elbow direction in that frame
# is the shoulder yaw axis, pointing to the elbow.
upper_arm_dir_local (0.0 0.0 -1.0)
