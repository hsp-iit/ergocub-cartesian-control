# Retargeting to the walking-controller (requires building with WalkingControllers).
# Including this group sends the joint references to walking_port_name instead of the motors;
# without it the motors are commanded directly. The connection is manual:
#   yarp connect /mc-ergocub-cartesian-bimanual/retargeting:o /walking-coordinator/humanState:i
walking_port_name /retargeting:o
