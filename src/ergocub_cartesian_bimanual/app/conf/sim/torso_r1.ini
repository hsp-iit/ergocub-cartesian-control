# CubJointControl
name torso
joint_axes_list (torso_yaw_joint)
joint_ports_list (/r1mk3Sim/torso)
joint_local_port /mc-ergocub-cartesian-bimanual/torso


# IK_PARAM
joint_limits_param 0.90 #0 < joint_limits_param < 1
joint_acc_weight 2.5 #cost weight
# Keep torso yaw available for reach, but biased toward the startup posture.
joint_pos_weight (0.20)
joint_pos_p_gain (10.0)
joint_pos_d_gain (15.0)
