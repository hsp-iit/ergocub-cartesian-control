# CubJointControl
name left_arm
joint_axes_list (l_shoulder_pitch l_shoulder_roll l_shoulder_yaw l_elbow l_wrist_yaw l_wrist_roll l_wrist_pitch)
joint_ports_list (/r1mk3Sim/left_arm)
joint_local_port /mc-ergocub-cartesian-bimanual/left_arm


# IK_PARAM
joint_limits_param 0.90 #0 < joint_limits_param < 1
joint_acc_weight 2.5 #cost weight
# R1 grasping-safe baseline: symmetric with right arm.
joint_pos_weight (0.03  0.03    0.03    0.35    0.05    0.05    0.05)
joint_pos_p_gain (4.0   4.0     4.0     8.0     4.0     4.0     4.0)
joint_pos_d_gain (5.5   5.5     5.5     12.0    5.5     5.5     5.5)
cartesian_pos_weight 12.0
cartesian_pos_p_gain 80.0
cartesian_pos_d_gain 18.0
cartesian_ori_weight 0.05
cartesian_ori_p_gain 60.0
cartesian_ori_d_gain 15.0
improve_manip_weight 0.0001 # keep small; large values can pull away from the target pose


# FK_PARAM
root_frame_name base_link
ee_frame_name l_hand_palm


# FSM_PARAM
stop_vel 0.0175  #[rad] 0.0175 = 1.0 deg; 0.0314159 rad = 2.0 deg;  0.0087 rad = 0.5 deg
